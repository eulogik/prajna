<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="system-ui, -apple-system, sans-serif">
  <rect width="880" height="280" fill="white"/>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Figure 2. GEN\_CLAMP: harvest answer knowledge from $L{-}2$.</text>
  <!-- prompt tokens -->
  <rect x="30" y="100" width="100" height="50" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="80" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">prompt</text>
  <text x="80" y="140" text-anchor="middle" font-size="11" fill="#0284c7">tokens</text>

  <rect x="160" y="100" width="100" height="50" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="210" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">: separator</text>
  <text x="210" y="140" text-anchor="middle" font-size="11" fill="#a16207">L-2</text>

  <!-- L-1 (bad) -->
  <rect x="290" y="100" width="100" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="340" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">L-1</text>
  <text x="340" y="140" text-anchor="middle" font-size="11" fill="#dc2626">= '4' (base prior)</text>

  <!-- L-2 (correct) -->
  <rect x="420" y="100" width="100" height="50" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="470" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">L-2</text>
  <text x="470" y="140" text-anchor="middle" font-size="11" fill="#059669">= Au (correct)</text>

  <!-- standard decode arrow -->
  <line x1="340" y1="150" x2="340" y2="200" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="340" y="220" text-anchor="middle" font-size="11" fill="#991b1b">Standard greedy: digit '4'</text>

  <!-- GEN_CLAMP arrow -->
  <line x1="470" y1="150" x2="560" y2="200" stroke="#10b981" stroke-width="2"/>
  <rect x="560" y="195" width="120" height="36" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="620" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">GEN_CLAMP</text>
  <text x="680" y="210" font-size="11" fill="#059669">→ Au</text>

  <text x="440" y="260" text-anchor="middle" font-size="11" fill="#888">Answer knowledge resides at L-2; L-1 carries only the frozen base's prior (masked in SFT).</text>
</svg>