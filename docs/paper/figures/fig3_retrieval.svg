<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" font-family="system-ui, -apple-system, sans-serif">
  <rect width="880" height="220" fill="white"/>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Figure 3. Memory-augmented retrieval gate.</text>
  <!-- boxes -->
  <rect x="30" y="70" width="140" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Query</text>
  <text x="100" y="112" text-anchor="middle" font-size="11" fill="#3b82f6">prompt</text>

  <rect x="220" y="70" width="140" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="290" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Embed</text>
  <text x="290" y="112" text-anchor="middle" font-size="11" fill="#d97706">mean-pool</text>

  <rect x="410" y="70" width="140" height="56" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Cosine</text>
  <text x="480" y="112" text-anchor="middle" font-size="11" fill="#059669">match</text>

  <rect x="600" y="70" width="140" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="670" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">sim ≥ 0.9?</text>

  <!-- yes branch -->
  <rect x="780" y="30" width="80" height="36" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="820" y="53" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Replay</text>
  <text x="820" y="75" text-anchor="middle" font-size="10" fill="#059669">stored</text>
  <!-- no branch -->
  <rect x="780" y="105" width="80" height="36" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="820" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">CRN</text>
  <text x="820" y="150" text-anchor="middle" font-size="10" fill="#ef4444">generate</text>

  <!-- arrows -->
  <line x1="170" y1="98" x2="220" y2="98" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="98" x2="410" y2="98" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="98" x2="600" y2="98" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="740" y1="80" x2="780" y2="55" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="740" y1="115" x2="780" y2="130" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="750" y="45" font-size="10" fill="#10b981">yes</text>
  <text x="750" y="155" font-size="10" fill="#ef4444">no</text>

  <text x="440" y="195" text-anchor="middle" font-size="11" fill="#888">17,810 entries; min sim 0.881, median 0.972 across 120 reworded queries.</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#94a3b8"/></marker></defs>
</svg>